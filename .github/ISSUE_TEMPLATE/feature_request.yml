name: Feature request
description: Propose a user-facing product capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the job-seeker problem without prescribing a technology.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should the user be able to accomplish?
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: Out of scope
      description: What should this proposal deliberately not include?
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that indicate completion.
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data, AI, and privacy considerations
      description: Explain affected local data, AI calls, credentials, and user-control requirements.
